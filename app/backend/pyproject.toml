[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "python-multipart",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "scenedetect==0.6.7.1",
    "opencv-python-headless",
    "sqlalchemy==2.0.23",
    "sse-starlette",
    "python-dotenv",
    "av",
    "deep-translator>=1.11.4",
    "tzdata",
]
[tool.ruff.lint]
ignore = ["E501", "F401", "E402"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
